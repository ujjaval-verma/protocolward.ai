run:
  timeout: 5m
  go: "1.26"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - revive
    - gosec
    - bodyclose
    - misspell
    - unconvert
    - prealloc
    - copyloopvar
    - nilerr
    - errorlint
    - exhaustive
    # Issue #24 slice 1. contextcheck comes in a later slice.
    - funlen
    - dupl
    - gocritic
    - noctx
    - nolintlint
    - errname
    - forcetypeassert
    - thelper
    # Issue #24 slice 2.
    - gocognit

linters-settings:
  gocognit:
    # The v1 default, explicit for the v2 migration. Existing test
    # functions over 30 are listed under issues.exclude-rules.
    min-complexity: 30
  funlen:
    # 80 body lines. funlen does not count the signature or the closing
    # brace, so a function may span up to 82 source lines: this does not
    # exactly encode #20's "nothing over 80 lines". Moving to 78 needs
    # the production functions on the list below split, and serveRun and
    # loadOne trimmed too (issue #24). Statements are not limited.
    # ignore-comments is explicit so a v2 migration cannot change the count.
    lines: 80
    statements: -1
    ignore-comments: false
  dupl:
    threshold: 150  # the v1 default, explicit for the v2 migration
  nolintlint:
    require-explanation: true
    require-specific: true
    allow-unused: false
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
      - name: error-return
      - name: error-naming
      - name: indent-error-flow
      - name: unused-parameter
        disabled: true  # too noisy with cobra RunE signatures
  gosec:
    excludes:
      - G104  # errcheck covers this; gosec duplicates noisily
  errorlint:
    asserts: false  # type assertions on errors are sometimes intentional
  exhaustive:
    default-signifies-exhaustive: false
    check:
      - switch
    # Scope is implicit: exhaustive runs on all switches; with
    # default-signifies-exhaustive=false, switches lacking a default
    # arm that covers every variant are flagged. policy.Action,
    # config.BlockResponseMode, and schema.Verdict are the principal
    # targets; this also catches any prior switches that should have
    # been exhaustive.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    # funlen ratchet (issue #24). These functions were over 80 lines when
    # funlen was enabled. Each rule pins its file and, by `source:`, the
    # declaration up to the opening "(": `func`, receiver (variable and
    # type) and name. Changing parameters or results keeps the exemption;
    # renaming the function or its receiver drops it and lint fails.
    # Remove an entry when its function is split; never add one. Any other
    # function over 80 lines fails lint.
    - path: (^|/)config/config\.go$
      source: '^func (\(c Config\) validate|Load)\('
      linters:
        - funlen
    - path: (^|/)dataplane/dataplane\.go$
      source: '^func \(s \*Server\) handleQuery\('
      linters:
        - funlen
    - path: (^|/)update/verify\.go$
      source: '^func Verify\('
      linters:
        - funlen
    - path: _test\.go$
      source: '^func (TestExitHatch|TestServeUntilStopped|TestShutdownServe|TestLoadServePolicy|TestLoadServeConfig|TestLoadHostLists|TestOpenModelClassifier|TestHandleQuery_Decoy_Alerts_And_Sinkholes|TestLoad_ValidationMessages_Locked|TestLoad_ValidationErrors_NameRemediation|FuzzHostlistLoad|FuzzDecoyNew|\(s \*FakeDoTServer\) handleConn|TestShutdown_SecondCallWaitsForOwnerToStopListeners|TestServe_ShutdownWithOnlyUDPServing_ReportsTCPNotStarted|writeVariant|BenchmarkHandleQuery)\('
      linters:
        - funlen
    # gocognit ratchet (issue #24). These test functions were over 30
    # when gocognit was enabled. Each rule pins its file and, by
    # `source:`, the declaration up to the opening "(". Remove an entry
    # when its function is split; never add one. Production code has no
    # entry: any production function over 30 fails lint.
    - path: (^|/)cmd/ward/classifier_test\.go$
      source: '^func TestOpenModelClassifier\('
      linters: [gocognit]
    - path: (^|/)cmd/ward/serve_shutdown_test\.go$
      source: '^func (TestServeUntilStopped|TestShutdownServe)\('
      linters: [gocognit]
    - path: (^|/)cmd/ward/serve_startup_test\.go$
      source: '^func (TestLoadHostLists|TestLoadServePolicy|TestLoadServeConfig)\('
      linters: [gocognit]
    - path: (^|/)internal/config/config_test\.go$
      source: '^func TestValidateListen\('
      linters: [gocognit]
    - path: (^|/)internal/config/fuzz_test\.go$
      source: '^func FuzzLoad\('
      linters: [gocognit]
    - path: (^|/)internal/dataplane/handlequery_bench_internal_test\.go$
      source: '^func BenchmarkHandleQuery\('
      linters: [gocognit]
    - path: (^|/)internal/dataplane/serve_bind_internal_test\.go$
      source: '^func TestBind_TCPTwinRetry\('
      linters: [gocognit]
    - path: (^|/)internal/dataplane/serve_shutdown_internal_test\.go$
      source: '^func TestShutdown_SecondCallWaitsForOwnerToStopListeners\('
      linters: [gocognit]
    - path: (^|/)internal/decoy/fuzz_internal_test\.go$
      source: '^func FuzzDecoyNew\('
      linters: [gocognit]
    - path: (^|/)internal/hostlist/arena_internal_test\.go$
      source: '^func TestCrossSourceSemantics\('
      linters: [gocognit]
    - path: (^|/)internal/hostlist/fuzz_internal_test\.go$
      source: '^func FuzzHostlistLoad\('
      linters: [gocognit]
    - path: (^|/)internal/upstream/fake_dot_test\.go$
      source: '^func \(s \*FakeDoTServer\) handleConn\('
      linters: [gocognit]
