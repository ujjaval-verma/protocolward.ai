# Protocol Ward — release pipeline.
# Triggers ONLY on `push: tags: ['v*.*.*']`. PR CI is deferred per ADR-0002 §1.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # publish release artifacts
      id-token: write   # cosign keyless OIDC
    steps:
      - name: Checkout (full history for tag changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          # Pinned so an installer default bump cannot change the signature format.
          # cosign v3 writes a Sigstore bundle (.goreleaser.yaml `signs:`).
          cosign-release: 'v3.0.6'

      - name: Run local CI (lint + vet + test + build)
        run: make ci

      - name: Release with goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: v2.16.0  # MUST match GORELEASER_VERSION in Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
