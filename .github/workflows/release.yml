# Protocol Ward — release pipeline.
# Triggers ONLY on `push: tags: ['v*.*.*']`. PR CI is deferred per ADR-0002 §1.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # publish release artifacts
      id-token: write   # cosign keyless OIDC
    steps:
      - name: Checkout (full history for tag changelog)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Run local CI (lint + vet + test + build)
        run: make ci

      - name: Release with goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7.2.2
        with:
          distribution: goreleaser
          version: v2.16.0  # MUST match GORELEASER_VERSION in Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
