# Protocol Ward — goreleaser config.
# Manual smoke: `goreleaser release --snapshot --clean --skip=sign` (no tag required).
# Real release: triggered by .github/workflows/release.yml on `push: tags: ['v*.*.*']`.
version: 2

project_name: ward

before:
  hooks:
    - go mod verify
    # Licence texts of every module linked into ward + the Go standard library.
    # Fails the release if a linked module has no licence file.
    - scripts/third-party-licenses.sh THIRD_PARTY_LICENSES

builds:
  - id: ward
    main: ./cmd/ward
    binary: ward
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - id: ward
    formats: [tar.gz]
    name_template: "ward_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - README.md
      - THIRD_PARTY_LICENSES/MODULES.txt
      - THIRD_PARTY_LICENSES/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

signs:
  # cosign v3 keyless: one Sigstore bundle (signature + Fulcio certificate +
  # Rekor entry) per signed artifact. Users verify with
  # `cosign verify-blob --bundle checksums.txt.sigstore.json ...`
  # (docs/engineering/release.md).
  - id: cosign-keyless
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  draft: false
  prerelease: auto
  mode: replace

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "Merge pull request"
