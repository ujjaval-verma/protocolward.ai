# Hook tiering — see docs/engineering/decisions/ADR-0002-security-posture.md
# pre-commit is the fast tier; pre-push carries the heavy gates and has a cold-run time budget
# (empty Go build + lint caches). govulncheck on pre-push is the supply-chain enforcement point.

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # testdata/update/ holds byte-stable cryptographic fixtures
      # (cosign-signed TUF metadata + deliberately-malformed siblings).
      # Auto-fixers corrupt the signed bytes; the json-checker correctly
      # rejects the tampered-target fixture, which is the point.
      - id: trailing-whitespace
        exclude: ^testdata/update/
      - id: end-of-file-fixer
        exclude: ^testdata/update/
      - id: check-yaml
      - id: check-json
        exclude: ^testdata/update/
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^testdata/update/

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # doubleclick is a real Google ad domain on our tracker blocklist;
        # codespell wants "double-click" which is wrong for a hostname. fpr = false-positive rate.
        args: ["--ignore-words-list=ans,iam,hda,cna,doubleclick,fpr"]
        # Generated DGA + real-domain eval fixture: random labels, not prose.
        # go.sum holds base64 hashes, which codespell reads as misspellings.
        exclude: ^(testdata/eval/lexical-v1\.jsonl|go\.sum)$

  # --- pre-push (heavier; cold-run time budget in ADR-0002) ---

  - repo: local
    hooks:
      # Every pre-push gate is one Make target, `make pre-push`, run concurrently
      # (issue #25). pre-commit runs hooks one at a time, so separate hooks would
      # serialise the cheap gates behind the heavy ones; one -j8 target overlaps them all.
      # The gates are lint, vet, the full race suite (make test: one TEST_TIMEOUT),
      # the js/wasm compile + 5 MB size gate, go mod tidy -diff, go mod verify and
      # govulncheck, plus the invariant gates below. -k lets every gate finish when
      # one fails, and Make names each failing gate ("[check-spdx] Error 1").
      # When the hook fails, search its output for `make: *** [` to find the failing
      # gate, then rerun `make <gate>` alone.
      # Invariant gates (issue #10): check-public, check-spdx, check-testing-doc,
      # check-licenses and check-actions-pinned are the same Make targets
      # `make check`/`make ci` run, so the hook and the manual gate cannot drift;
      # they scan the whole tree, not the files being pushed.
      # Issue #42: check-actions-pinned refuses a workflow uses: not pinned to a full
      # commit SHA before the push (GitHub only rejects it at job setup).
      # `make lint` uses the pinned .tools/ golangci-lint, built with the repo's
      # own Go toolchain (the upstream pre-commit golang env cannot read its export data).
      - id: pre-push-gates
        name: pre-push gates (make -k -j8 pre-push)
        entry: make -k -j8 pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
