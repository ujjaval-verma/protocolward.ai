# Hook tiering — see docs/engineering/decisions/ADR-0002-security-posture.md
# pre-commit ≤5s; pre-push ≤20s cold (empty Go build + lint caches). govulncheck on pre-push is the supply-chain enforcement point.

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # testdata/update/ holds byte-stable cryptographic fixtures
      # (cosign-signed TUF metadata + deliberately-malformed siblings).
      # Auto-fixers corrupt the signed bytes; the json-checker correctly
      # rejects the tampered-target fixture, which is the point.
      - id: trailing-whitespace
        exclude: ^testdata/update/
      - id: end-of-file-fixer
        exclude: ^testdata/update/
      - id: check-yaml
      - id: check-json
        exclude: ^testdata/update/
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^testdata/update/

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # doubleclick is a real Google ad domain on our tracker blocklist;
        # codespell wants "double-click" which is wrong for a hostname. fpr = false-positive rate.
        args: ["--ignore-words-list=ans,iam,hda,cna,doubleclick,fpr"]
        # Generated DGA + real-domain eval fixture: random labels, not prose.
        # go.sum holds base64 hashes, which codespell reads as misspellings.
        exclude: ^(testdata/eval/lexical-v1\.jsonl|go\.sum)$

  # --- pre-push (heavier; ≤20s cold budget) ---

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy -diff
        entry: go mod tidy -diff
        language: system
        pass_filenames: false
        stages: [pre-push]
      # lint, vet, the full race suite (make test: one TEST_TIMEOUT) and the
      # js/wasm compile + 5 MB size gate, run concurrently through the same Make
      # targets `make check`/`make ci` use. pre-commit runs hooks one at a time;
      # overlapping these keeps cold pre-push inside the 20 s budget (issue #25).
      # `make lint` uses the pinned .tools/ golangci-lint, built with the repo's
      # own Go toolchain (the upstream pre-commit golang env cannot read its export data).
      - id: go-heavy
        name: lint + vet + race tests + wasm gate (make -j4)
        entry: make -j4 lint vet test wasm
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: go-mod-verify
        name: go mod verify
        entry: go mod verify
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: govulncheck
        name: govulncheck
        entry: .tools/govulncheck ./...
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Invariant gates (issue #10): the same Make targets `make check`/`make ci`
      # run, so the hook and the manual gate cannot drift. always_run because
      # they scan the whole tree, not the files being pushed.
      - id: check-public
        name: check-public (public-content gate)
        entry: make check-public
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-spdx
        name: check-spdx (SPDX header gate)
        entry: make check-spdx
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-testing-doc
        name: check-testing-doc (testing.md row gate)
        entry: make check-testing-doc
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-licenses
        name: check-licenses (third-party licence gate)
        entry: make check-licenses
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Issue #42: refuse a workflow uses: not pinned to a full commit SHA before the
      # push (GitHub only rejects it at job setup). Same Make target as `make check`.
      - id: check-actions-pinned
        name: check-actions-pinned (Actions SHA-pin gate)
        entry: make check-actions-pinned
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
